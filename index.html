<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Business Chat - Preeti</title>
    <style>
        :root {
            --primary-red: #b30000;
            --light-red: #ff4d4d;
            --bg-color: #fff5f5;
            --text-dark: #333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-dark); display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .app-container { width: 100%; max-width: 480px; height: 100%; background: #fff; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(179,0,0,0.2); }
        
        /* Header */
        .app-header { background-color: var(--primary-red); color: white; padding: 15px; display: flex; align-items: center; gap: 12px; }
        .app-header img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid white; }
        .app-header h2 { font-size: 18px; }
        .app-header p { font-size: 12px; color: #ffcccc; }

        /* Screens */
        .screen { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .hidden { display: none !important; }

        /* Login Screen */
        .login-box { padding: 30px; display: flex; flex-direction: column; gap: 15px; justify-content: center; height: 100%; }
        .login-box h2 { color: var(--primary-red); text-align: center; margin-bottom: 10px; }
        .input-field { padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; outline: none; }
        .input-field:focus { border-color: var(--primary-red); }
        .btn { background-color: var(--primary-red); color: white; padding: 12px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn:hover { background-color: #990000; }

        /* Chat List Screen */
        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item { display: flex; align-items: center; padding: 12px 15px; border-bottom: 1px solid #eee; cursor: pointer; gap: 12px; }
        .chat-item:hover { background-color: #fff0f0; }
        .chat-item img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .chat-info h4 { font-size: 16px; color: #111; }
        .chat-info p { font-size: 13px; color: #666; margin-top: 3px; }

        /* Chat Room Screen */
        .messages-area { flex: 1; padding: 15px; overflow-y: auto; background: #fafafa; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 75%; padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.4; }
        .message.received { background: white; align-self: flex-start; border: 1px solid #ddd; }
        .message.sent { background: #ffe6e6; align-self: flex-end; color: #990000; }

        .chat-input-area { padding: 10px 15px; background: white; display: flex; gap: 10px; border-top: 1px solid #ddd; align-items: center; }
        .chat-input-area input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        .send-btn { background: var(--primary-red); color: white; border: none; padding: 10px 18px; border-radius: 20px; cursor: pointer; }

        /* Bottom Nav / Tabs */
        .nav-tabs { display: flex; background: #f8f8f8; border-top: 1px solid #ddd; }
        .nav-tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; font-weight: bold; color: #666; font-size: 14px; }
        .nav-tab.active { color: var(--primary-red); border-top: 2px solid var(--primary-red); background: white; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Header -->
        <div class="app-header">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="Preeti DP">
            <div>
                <h2>My Business Chat</h2>
                <p>پریتی (Preeti) سے رابطہ کریں</p>
            </div>
        </div>

        <!-- 1. Login Screen -->
        <div id="loginScreen" class="screen">
            <div class="login-box">
                <h2>لاگ ان کریں</h2>
                <input type="text" id="userName" class="input-field" placeholder="اپنا نام لکھیں">
                <input type="text" id="userPhone" class="input-field" placeholder="فون نمبر (مثلاً 03001234567)">
                <input type="password" id="userPass" class="input-field" placeholder="پاس ورڈ درج کریں">
                <button class="btn" onclick="handleLogin()">شروع کریں</button>
            </div>
        </div>

        <!-- 2. Main App Screen (Chats & Groups) -->
        <div id="mainScreen" class="screen hidden">
            
            <!-- Tabs -->
            <div class="nav-tabs">
                <div class="nav-tab active" onclick="switchTab('chats')">چیٹس</div>
                <div class="nav-tab" onclick="switchTab('groups')">فیملی گروپس</div>
            </div>

            <!-- Chat List View -->
            <div id="chatsTab" class="chat-list">
                <div class="chat-item" onclick="openChat('Preeti (Admin)')">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="Preeti">
                    <div class="chat-info">
                        <h4>Preeti (پریتی)</h4>
                        <p>السلام علیکم! بتائیے کیسے مدد کر سکتی ہوں؟</p>
                    </div>
                </div>
            </div>

            <!-- Groups View -->
            <div id="groupsTab" class="chat-list hidden">
                <div class="chat-item" onclick="openChat('فیملی بزنس گروپ')">
                    <img src="https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?w=100" alt="Group">
                    <div class="chat-info">
                        <h4>فیملی بزنس گروپ</h4>
                        <p>تمام فیملی ممبرز کا مشترکہ گروپ</p>
                    </div>
                </div>
            </div>

        </div>

        <!-- 3. Chat Room Screen -->
        <div id="chatRoomScreen" class="screen hidden">
            <div style="background: #eee; padding: 10px 15px; display: flex; align-items: center; gap: 10px; cursor: pointer;" onclick="backToMain()">
                <strong>← واپس جائیں</strong>
                <span id="chatTitle" style="font-weight: bold; color: var(--primary-red);">چیٹ</span>
            </div>
            
            <div class="messages-area" id="messagesArea">
                <div class="message received">ہیلو! آپ پریتی سے براہ راست بات کر رہے ہیں۔ اپنا پیغام بھیجیں۔</div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="messageInput" placeholder="یہاں میسج لکھیں...">
                <button class="send-btn" onclick="sendMessage()">بھیجیں</button>
            </div>
        </div>

    </div>

    <script>
        function handleLogin() {
            const name = document.getElementById('userName').value;
            const phone = document.getElementById('userPhone').value;
            if(name && phone) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainScreen').classList.remove('hidden');
            } else {
                alert('براہ کرم نام اور فون نمبر دونوں درج کریں!');
            }
        }

        function switchTab(tabName) {
            const tabs = document.querySelectorAll('.nav-tab');
            tabs.forEach(t => t.classList.remove('active'));
            
            if(tabName === 'chats') {
                document.getElementById('chatsTab').classList.remove('hidden');
                document.getElementById('groupsTab').classList.add('hidden');
                event.target.classList.add('active');
            } else {
                document.getElementById('groupsTab').classList.remove('hidden');
                document.getElementById('chatsTab').classList.add('hidden');
                event.target.classList.add('active');
            }
        }

        function openChat(name) {
            document.getElementById('mainScreen').classList.add('hidden');
            document.getElementById('chatRoomScreen').classList.remove('hidden');
            document.getElementById('chatTitle').innerText = name;
        }

        function backToMain() {
            document.getElementById('chatRoomScreen').classList.add('hidden');
            document.getElementById('mainScreen').classList.remove('hidden');
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if(text) {
                const area = document.getElementById('messagesArea');
                const msg = document.createElement('div');
                msg.className = 'message sent';
                msg.innerText = text;
                area.appendChild(msg);
                input.value = '';
                area.scrollTop = area.scrollHeight;
            }
        }
    </script>
</body>
</html>

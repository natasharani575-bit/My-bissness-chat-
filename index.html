<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Business Chat - Preeti</title>
    <style>
        :root {
            --primary-red: #b30000;
            --light-red: #ff4d4d;
            --bg-color: #fff5f5;
            --text-dark: #333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-dark); display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .app-container { width: 100%; max-width: 480px; height: 100%; background: #fff; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(179,0,0,0.2); }
        
        /* Header */
        .app-header { background-color: var(--primary-red); color: white; padding: 15px; display: flex; align-items: center; justify-content: space-between; }
        .header-profile { display: flex; align-items: center; gap: 12px; }
        .app-header img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid white; }
        .app-header h2 { font-size: 18px; }
        .app-header p { font-size: 12px; color: #ffcccc; }
        .logout-btn { background: #fff; color: var(--primary-red); border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; }

        /* Tabs for Admin */
        .admin-tabs { display: flex; background: #e60000; border-bottom: 1px solid #990000; }
        .tab-btn { flex: 1; background: none; border: none; color: white; padding: 10px; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center; }
        .tab-btn.active { background: #990000; border-bottom: 3px solid white; }

        /* Screens */
        .screen { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .hidden { display: none !important; }

        /* Login Screen */
        .login-box { padding: 30px; display: flex; flex-direction: column; gap: 15px; justify-content: center; height: 100%; overflow-y: auto; }
        .login-box h2 { color: var(--primary-red); text-align: center; margin-bottom: 10px; }
        .input-field { padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; outline: none; }
        .input-field:focus { border-color: var(--primary-red); }
        .file-label { font-size: 14px; color: #555; background: #fff0f0; padding: 10px; border: 1px dashed var(--primary-red); border-radius: 8px; text-align: center; cursor: pointer; }
        .btn { background-color: var(--primary-red); color: white; padding: 12px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn:hover { background-color: #990000; }

        /* Chat List & Calls List */
        .list-container { flex: 1; overflow-y: auto; }
        .list-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 15px; border-bottom: 1px solid #eee; cursor: pointer; }
        .list-item:hover { background-color: #fff0f0; }
        .list-item-left { display: flex; align-items: center; gap: 12px; flex: 1; }
        .list-item img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .list-info h4 { font-size: 16px; color: #111; }
        .list-info p { font-size: 13px; color: #666; margin-top: 3px; }
        .toggle-call-btn { background: #ff4d4d; color: white; border: none; padding: 6px 10px; border-radius: 5px; font-size: 11px; cursor: pointer; }
        .toggle-call-btn.disabled { background: #888; }

        /* Chat Room Screen */
        .chat-room-header { background: #eee; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #ccc; }
        .header-actions { display: flex; align-items: center; gap: 8px; }
        .call-action-btn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 5px; }
        .clear-chat-btn { background: var(--primary-red); color: white; border: none; padding: 5px 8px; border-radius: 5px; font-size: 11px; cursor: pointer; font-weight: bold; }
        
        .messages-area { flex: 1; padding: 15px; overflow-y: auto; background: #fafafa; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 75%; padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.4; word-break: break-word; }
        .message.received { background: white; align-self: flex-start; border: 1px solid #ddd; }
        .message.sent { background: #ffe6e6; align-self: flex-end; color: #990000; }
        .message img, .message video, .message audio { max-width: 100%; border-radius: 8px; margin-top: 5px; display: block; background: #000; }
        .message audio { width: 220px; height: 40px; }

        .chat-input-area { padding: 10px 15px; background: white; display: flex; gap: 8px; border-top: 1px solid #ddd; align-items: center; }
        .chat-input-area input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        .media-btn { background: #eee; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #555; }
        .media-btn.recording { background: #ff3b30; color: white; animation: pulse 1.2s infinite; }
        .send-btn { background: var(--primary-red); color: white; border: none; padding: 10px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Call Modal */
        .call-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 1000; gap: 20px; }
        .call-modal h3 { font-size: 22px; }
        .call-modal p { font-size: 14px; color: #ccc; }
        .end-call-btn { background: #ff3b30; color: white; border: none; padding: 12px 25px; border-radius: 30px; font-size: 16px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body onload="initApp()">

    <div class="app-container">
        
        <!-- Header -->
        <div class="app-header">
            <div class="header-profile">
                <img id="headerDp" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="DP">
                <div>
                    <h2 id="headerTitle">My Business Chat</h2>
                    <p id="headerSubtitle">Welcome</p>
                </div>
            </div>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>

        <!-- 1. Login Screen -->
        <div id="loginScreen" class="screen">
            <div class="login-box">
                <h2>Login</h2>
                <input type="text" id="userName" class="input-field" placeholder="Enter your name">
                <input type="text" id="userPhone" class="input-field" placeholder="Phone number (e.g. 03001234567)">
                <input type="password" id="userPass" class="input-field" placeholder="Password (Admin only)">
                
                <label class="file-label" for="userDpInput">📷 Select your Profile Picture (DP)</label>
                <input type="file" id="userDpInput" accept="image/*" style="display: none;" onchange="previewDp(event)">
                
                <button class="btn" onclick="handleLogin()">Get Started</button>
            </div>
        </div>

        <!-- 2. Main Admin Screen with Tabs -->
        <div id="mainScreen" class="screen hidden">
            <div class="admin-tabs">
                <button class="tab-btn active" id="chatsTabBtn" onclick="switchAdminTab('chats')">💬 Chats</button>
                <button class="tab-btn" id="callsTabBtn" onclick="switchAdminTab('calls')">📞 Call History</button>
            </div>
            
            <!-- Chats List View -->
            <div id="chatsContainer" class="list-container"></div>
            
            <!-- Calls History View -->
            <div id="callsContainer" class="list-container hidden"></div>
        </div>

        <!-- 3. Chat Room Screen -->
        <div id="chatRoomScreen" class="screen hidden">
            <div class="chat-room-header">
                <div style="display: flex; align-items: center; gap: 10px; cursor: pointer;" onclick="backToMain()">
                    <strong id="backText">← Back</strong>
                    <span id="chatTitle" style="font-weight: bold; color: var(--primary-red);">Chat</span>
                </div>
                <div class="header-actions">
                    <button class="call-action-btn" id="voiceCallBtn" onclick="startCall('audio')" title="Voice Call">📞</button>
                    <button class="call-action-btn" id="videoCallBtn" onclick="startCall('video')" title="Video Call">📹</button>
                    <button class="clear-chat-btn" onclick="clearChat()">Clear Chat</button>
                </div>
            </div>
            
            <div class="messages-area" id="messagesArea">
                <!-- Messages load here -->
            </div>

            <div class="chat-input-area">
                <button class="media-btn" onclick="document.getElementById('mediaInput').click()" title="Send Image or Video">📎</button>
                <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;" onchange="handleMediaSelection(event)">
                
                <!-- Voice Note Button -->
                <button class="media-btn" id="voiceRecordBtn" onclick="toggleVoiceRecording()" title="Record Voice Note">🎤</button>

                <input type="text" id="messageInput" placeholder="Type a message here..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button class="send-btn" onclick="sendMessage()">Send</button>
            </div>
        </div>

    </div>

    <!-- Call Simulation Modal -->
    <div id="callModal" class="call-modal hidden">
        <h3 id="callTypeTitle">Audio Call in Progress...</h3>
        <p id="callTargetName">Connecting...</p>
        <button class="end-call-btn" onclick="endCall()">End Call</button>
    </div>

    <script>
        let db = null;
        let currentChatRoom = '';
        let currentUser = null;
        let selectedDpBase64 = 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100';
        
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        function initApp() {
            try {
                const request = indexedDB.open("BusinessChatDB", 1);
                request.onerror = function(event) {
                    console.error("IndexedDB error: " + event.target.errorCode);
                    checkAutoLogin();
                };
                request.onsuccess = function(event) {
                    db = event.target.result;
                    checkAutoLogin();
                };
                request.onupgradeneeded = function(event) {
                    let database = event.target.result;
                    if (!database.objectStoreNames.contains("mediaStore")) {
                        database.createObjectStore("mediaStore", { keyPath: "id" });
                    }
                };
            } catch (e) {
                console.log("IndexedDB not supported or blocked");
                checkAutoLogin();
            }
        }

        function previewDp(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedDpBase64 = e.target.result;
                    document.querySelector('.file-label').innerText = '✓ Profile Picture Selected';
                };
                reader.readAsDataURL(file);
            }
        }

        function checkAutoLogin() {
            const savedUser = localStorage.getItem('chat_active_user');
            if (savedUser) {
                try {
                    currentUser = JSON.parse(savedUser);
                    setupAppUI();
                } catch (e) {
                    localStorage.removeItem('chat_active_user');
                }
            }
        }

        function handleLogin() {
            const nameInput = document.getElementById('userName');
            const phoneInput = document.getElementById('userPhone');
            const passInput = document.getElementById('userPass');

            if (!nameInput || !phoneInput) return;

            const name = nameInput.value.trim();
            const phone = phoneInput.value.trim();
            const pass = passInput ? passInput.value.trim() : '';

            if (!name || !phone) {
                alert('Please enter your name and phone number!');
                return;
            }

            let isAdmin = (name.toLowerCase() === 'preeti' && pass === 'preeti123');
            
            currentUser = {
                name: name,
                phone: phone,
                isAdmin: isAdmin,
                dp: selectedDpBase64
            };

            localStorage.setItem('chat_active_user', JSON.stringify(currentUser));

            if (!isAdmin) {
                let allUsers = JSON.parse(localStorage.getItem('chat_all_users') || '[]');
                if (!allUsers.some(u => u.phone === phone)) {
                    allUsers.push(currentUser);
                    localStorage.setItem('chat_all_users', JSON.stringify(allUsers));
                } else {
                    allUsers = allUsers.map(u => u.phone === phone ? currentUser : u);
                    localStorage.setItem('chat_all_users', JSON.stringify(allUsers));
                }
            }

            setupAppUI();
        }

        function setupAppUI() {
            const loginScreen = document.getElementById('loginScreen');
            const headerDp = document.getElementById('headerDp');
            
            if (loginScreen) loginScreen.classList.add('hidden');
            if (headerDp && currentUser) headerDp.src = currentUser.dp;
            
            if (currentUser && currentUser.isAdmin) {
                document.getElementById('headerSubtitle').innerText = 'Preeti (Admin Panel)';
                document.getElementById('mainScreen').classList.remove('hidden');
                loadAdminChatList();
                loadAdminCallsList();
            } else if (currentUser) {
                document.getElementById('headerSubtitle').innerText = currentUser.name;
                document.getElementById('backText').style.display = 'none';
                openChat('Preeti_Admin_' + currentUser.phone, 'Preeti (Admin)', currentUser.phone);
            }
        }

        function switchAdminTab(tab) {
            const chatsTab = document.getElementById('chatsTabBtn');
            const callsTab = document.getElementById('callsTabBtn');
            const chatsContainer = document.getElementById('chatsContainer');
            const callsContainer = document.getElementById('callsContainer');

            if (tab === 'chats') {
                chatsTab.classList.add('active');
                callsTab.classList.remove('active');
                chatsContainer.classList.remove('hidden');
                callsContainer.classList.add('hidden');
                loadAdminChatList();
            } else {
                callsTab.classList.add('active');
                chatsTab.classList.remove('active');
                callsContainer.classList.remove('hidden');
                callsContainer.classList.add('hidden');
                loadAdminCallsList();
            }
        }

        function loadAdminChatList() {
            const container = document.getElementById('chatsContainer');
            container.innerHTML = '';
            
            let allUsers = JSON.parse(localStorage.getItem('chat_all_users') || '[]');
            
            if (allUsers.length === 0) {
                container.innerHTML = '<div style="padding: 20px; text-align: center; color: #666;">No users or family members have logged in yet.</div>';
                return;
            }

            allUsers.forEach(u => {
                const roomKey = 'Preeti_Admin_' + u.phone;
                let callDisabled = localStorage.getItem('call_disabled_' + u.phone) === 'true';

                const item = document.createElement('div');
                item.className = 'list-item';
                item.innerHTML = `
                    <div class="list-item-left" onclick="openChat('${roomKey}', '${u.name} (${u.phone})', '${u.phone}')">
                        <img src="${u.dp}" alt="DP">
                        <div class="list-info">
                            <h4>${u.name}</h4>
                            <p>Phone: ${u.phone}</p>
                        </div>
                    </div>
                    <button class="toggle-call-btn ${callDisabled ? 'disabled' : ''}" onclick="toggleUserCalls('${u.phone}', event)">
                        ${callDisabled ? 'Calls Disabled (Enable)' : 'Toggle Call On/Off'}
                    </button>
                `;
                container.appendChild(item);
            });
        }

        function loadAdminCallsList() {
            const container = document.getElementById('callsContainer');
            container.innerHTML = '';
            
            let callHistory = JSON.parse(localStorage.getItem('admin_call_logs') || '[]');
            
            if (callHistory.length === 0) {
                container.innerHTML = '<div style="padding: 20px; text-align: center; color: #666;">No call logs found.</div>';
                return;
            }

            callHistory.slice().reverse().forEach(call => {
                const roomKey = 'Preeti_Admin_' + call.phone;
                const timeStr = new Date(call.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                const item = document.createElement('div');
                item.className = 'list-item';
                item.onclick = () => openChat(roomKey, call.name + ' (' + call.phone + ')', call.phone);
                item.innerHTML = `
                    <div class="list-item-left">
                        <img src="${call.dp}" alt="DP">
                        <div class="list-info">
                            <h4>${call.name} (${call.type === 'video' ? '📹 Video Call' : '📞 Voice Call'})</h4>
                            <p>Time: ${timeStr} | Phone: ${call.phone}</p>
                        </div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function toggleUserCalls(phone, event) {
            event.stopPropagation();
            let key = 'call_disabled_' + phone;
            let currentStatus = localStorage.getItem(key) === 'true';
            localStorage.setItem(key, !currentStatus);
            loadAdminChatList();
        }

        function openChat(roomKey, title, phone) {
            currentChatRoom = roomKey;
            
            let callDisabled = localStorage.getItem('call_disabled_' + phone) === 'true';
            
            // Fixed: Now checking call status properly for users too, while keeping options visible if allowed
            if (callDisabled && currentUser && !currentUser.isAdmin) {
                document.getElementById('voiceCallBtn').style.display = 'none';
                document.getElementById('videoCallBtn').style.display = 'none';
            } else {
                document.getElementById('voiceCallBtn').style.display = 'inline-block';
                document.getElementById('videoCallBtn').style.display = 'inline-block';
            }

            if (currentUser && currentUser.isAdmin) {
                document.getElementById('mainScreen').classList.add('hidden');
            }
            document.getElementById('chatRoomScreen').classList.remove('hidden');
            document.getElementById('chatTitle').innerText = title;
            loadMessages();
        }

        function backToMain() {
            if (currentUser && currentUser.isAdmin) {
                document.getElementById('chatRoomScreen').classList.add('hidden');
                document.getElementById('mainScreen').classList.remove('hidden');
                loadAdminChatList();
                loadAdminCallsList();
            }
        }

        function startCall(type) {
            const modal = document.getElementById('callModal');
            const titleEl = document.getElementById('callTypeTitle');
            const targetEl = document.getElementById('callTargetName');

            if (type === 'audio') {
                titleEl.innerText = 'Audio Call in Progress...';
            } else {
                titleEl.innerText = 'Video Call in Progress...';
            }
            targetEl.innerText = document.getElementById('chatTitle').innerText;
            modal.classList.remove('hidden');

            // Log call for both user and admin actions if needed
            let callerName = currentUser.name;
            let callerPhone = currentUser.isAdmin ? currentChatRoom.replace('Preeti_Admin_', '') : currentUser.phone;
            let callerDp = currentUser.dp;

            let callLogs = JSON.parse(localStorage.getItem('admin_call_logs') || '[]');
            callLogs.push({
                name: callerName,
                phone: callerPhone,
                dp: callerDp,
                type: type,
                timestamp: Date.now()
            });
            localStorage.setItem('admin_call_logs', JSON.stringify(callLogs));
        }

        function endCall() {
            document.getElementById('callModal').classList.add('hidden');
        }

        function loadMessages() {
            const area = document.getElementById('messagesArea');
            area.innerHTML = '';
            
            let phoneToCheck = currentUser.isAdmin ? currentChatRoom.replace('Preeti_Admin_', '') : currentUser.phone;
            let clearedKey = 'cleared_' + phoneToCheck + '_' + currentChatRoom;
            let clearTime = localStorage.getItem(clearedKey) || 0;

            let allMessages = JSON.parse(localStorage.getItem('msgs_' + currentChatRoom) || '[]');
            
            let visibleMessages = allMessages.filter(m => {
                if (currentUser.isAdmin) return true;
                return m.timestamp > clearTime;
            });

            if (visibleMessages.length === 0) {
                area.innerHTML = '<div class="message received">Chat is empty. Send a new message, image, video or voice note.</div>';
                return;
            }

            visibleMessages.forEach(m => {
                const msg = document.createElement('div');
                msg.className = 'message ' + (m.senderName === currentUser.name ? 'sent' : 'received');
                
                let contentHtml = `<strong>${m.senderName}:</strong> `;
                if (m.type === 'text') {
                    contentHtml += `<span>${m.text}</span>`;
                    msg.innerHTML = contentHtml;
                    area.appendChild(msg);
                } else {
                    msg.innerHTML = contentHtml + `<span>Loading media...</span>`;
                    area.appendChild(msg);
                    
                    if (db) {
                        try {
                            let transaction = db.transaction(["mediaStore"], "readonly");
                            let store = transaction.objectStore("mediaStore");
                            let request = store.get(m.fileId);
                            
                            request.onsuccess = function(event) {
                                let result = event.target.result;
                                if (result) {
                                    if (m.type === 'image') {
                                        msg.innerHTML = `<strong>${m.senderName}:</strong> <img src="${result.data}" alt="Image">`;
                                    } else if (m.type === 'video') {
                                        msg.innerHTML = `<strong>${m.senderName}:</strong> <video controls src="${result.data}"></video>`;
                                    } else if (m.type === 'audio') {
                                        msg.innerHTML = `<strong>${m.senderName}:</strong> <audio controls src="${result.data}"></audio>`;
                                    }
                                } else {
                                    msg.innerHTML = `<strong>${m.senderName}:</strong> <span style="color:red;">[Media file missing]</span>`;
                                }
                            };
                            request.onerror = function() {
                                msg.innerHTML = `<strong>${m.senderName}:</strong> <span style="color:red;">[Error loading media]</span>`;
                            };
                        } catch (e) {
                            msg.innerHTML = `<strong>${m.senderName}:</strong> <span style="color:red;">[Database error]</span>`;
                        }
                    } else {
                        if (m.fallbackData) {
                            if (m.type === 'image') {
                                msg.innerHTML = `<strong>${m.senderName}:</strong> <img src="${m.fallbackData}" alt="Image">`;
                            } else if (m.type === 'video') {
                                msg.innerHTML = `<strong>${m.senderName}:</strong> <video controls src="${m.fallbackData}"></video>`;
                            } else if (m.type === 'audio') {
                                msg.innerHTML = `<strong>${m.senderName}:</strong> <audio controls src="${m.fallbackData}"></audio>`;
                            }
                        } else {
                            msg.innerHTML = `<strong>${m.senderName}:</strong> <span style="color:red;">[Media storage unavailable]</span>`;
                        }
                    }
                }
            });
            area.scrollTop = area.scrollHeight;
        }

        function clearChat() {
            if (confirm('Are you sure you want to clear this chat?')) {
                let phoneToCheck = currentUser.isAdmin ? currentChatRoom.replace('Preeti_Admin_', '') : currentUser.phone;
                if (currentUser.isAdmin) {
                    localStorage.removeItem('msgs_' + currentChatRoom);
                } else {
                    let clearedKey = 'cleared_' + phoneToCheck + '_' + currentChatRoom;
                    localStorage.setItem(clearedKey, Date.now());
                }
                loadMessages();
            }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (text !== '') {
                saveMessageToStorage({
                    senderName: currentUser.name,
                    type: 'text',
                    text: text,
                    timestamp: Date.now()
                });
                input.value = '';
            }
        }

        function handleMediaSelection(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result;
                let fileType = 'image';
                
                if (file.type.includes('video') || file.name.match(/\.(mp4|m4v|mov|webm|ogv)$/i)) {
                    fileType = 'video';
                }

                let fileId = 'media_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);

                if (db) {
                    try {
                        let transaction = db.transaction(["mediaStore"], "readwrite");
                        let store = transaction.objectStore("mediaStore");
                        store.put({ id: fileId, data: base64Data });

                        transaction.oncomplete = function() {
                            saveMessageToStorage({
                                senderName: currentUser.name,
                                type: fileType,
                                fileId: fileId,
                                timestamp: Date.now()
                            });
                        };
                        transaction.onerror = function() {
                            saveMessageToStorage({
                                senderName: currentUser.name,
                                type: fileType,
                                fileId: fileId,
                                fallbackData: base64Data,
                                timestamp: Date.now()
                            });
                        };
                    } catch (e) {
                        saveMessageToStorage({
                            senderName: currentUser.name,
                            type: fileType,
                            fileId: fileId,
                            fallbackData: base64Data,
                            timestamp: Date.now()
                        });
                    }
                } else {
                    saveMessageToStorage({
                        senderName: currentUser.name,
                        type: fileType,
                        fileId: fileId,
                        fallbackData: base64Data,
                        timestamp: Date.now()
                    });
                }
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function toggleVoiceRecording() {
            const btn = document.getElementById('voiceRecordBtn');
            
            if (!isRecording) {
                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = function() {
                            const base64Audio = reader.result;
                            let fileId = 'audio_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);

                            if (db) {
                                try {
                                    let transaction = db.transaction(["mediaStore"], "readwrite");
                                    let store = transaction.objectStore("mediaStore");
                                    store.put({ id: fileId, data: base64Audio });

                                    transaction.oncomplete = function() {
                                        saveMessageToStorage({
                                            senderName: currentUser.name,
                                            type: 'audio',
                                            fileId: fileId,
                                            timestamp: Date.now()
                                        });
                                    };
                                    transaction.onerror = function() {
                                        saveMessageToStorage({
                                            senderName: currentUser.name,
                                            type: 'audio',
                                            fileId: fileId,
                                            fallbackData: base64Audio,
                                            timestamp: Date.now()
                                        });
                                    };
                                } catch (e) {
                                    saveMessageToStorage({
                                        senderName: currentUser.name,
                                        type: 'audio',
                                        fileId: fileId,
                                        fallbackData: base64Audio,
                                        timestamp: Date.now()
                                    });
                                }
                            } else {
                                saveMessageToStorage({
                                    senderName: currentUser.name,
                                    type: 'audio',
                                    fileId: fileId,
                                    fallbackData: base64Audio,
                                    timestamp: Date.now()
                                });
                            }
                        };
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    btn.classList.add('recording');
                    btn.title = "Recording in progress... Click again to stop";
                }).catch(err => {
                    alert('Microphone permission denied!');
                });
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.classList.remove('recording');
                btn.title = "Record Voice Note";
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
        }

        function saveMessageToStorage(msgObj) {
            let allMessages = JSON.parse(localStorage.getItem('msgs_' + currentChatRoom) || '[]');
            allMessages.push(msgObj);
            localStorage.setItem('msgs_' + currentChatRoom, JSON.stringify(allMessages));
            loadMessages();
        }

        function handleLogout() {
            localStorage.removeItem('chat_active_user');
            location.reload();
        }
    </script>
</body>
</html>

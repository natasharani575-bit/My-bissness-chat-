<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Business Chat - Preeti</title>
    <style>
        :root {
            --primary-green: #075e54;
            --light-green: #25d366;
            --bg-color: #f0f2f5;
            --text-dark: #333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-dark); display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .app-container { width: 100%; max-width: 480px; height: 100%; background: #fff; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(7,94,84,0.2); }
        
        /* Header - WhatsApp Green */
        .app-header { background-color: var(--primary-green); color: white; padding: 15px; display: flex; align-items: center; justify-content: space-between; }
        .header-profile { display: flex; align-items: center; gap: 12px; }
        .app-header img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid white; }
        .app-header h2 { font-size: 18px; }
        .app-header p { font-size: 12px; color: #dcf8c6; }
        .logout-btn { background: #fff; color: var(--primary-green); border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; }

        /* Tabs */
        .admin-tabs { display: flex; background: var(--primary-green); border-bottom: 1px solid #054c44; }
        .tab-btn { flex: 1; background: none; border: none; color: white; padding: 10px; font-size: 13px; font-weight: bold; cursor: pointer; text-align: center; }
        .tab-btn.active { background: #054c44; border-bottom: 3px solid var(--light-green); }

        /* Screens */
        .screen { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .hidden { display: none !important; }

        /* Login Screen */
        .login-box { padding: 30px; display: flex; flex-direction: column; gap: 15px; justify-content: center; height: 100%; overflow-y: auto; }
        .login-box h2 { color: var(--primary-green); text-align: center; margin-bottom: 10px; }
        .input-field { padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; outline: none; }
        .input-field:focus { border-color: var(--light-green); }
        .file-label { font-size: 14px; color: #555; background: #ecfaf1; padding: 10px; border: 1px dashed var(--light-green); border-radius: 8px; text-align: center; cursor: pointer; }
        .btn { background-color: var(--light-green); color: #fff; padding: 12px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn:hover { background-color: #1ebd59; }

        /* Lists */
        .list-container { flex: 1; overflow-y: auto; }
        .list-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 15px; border-bottom: 1px solid #eee; cursor: pointer; }
        .list-item:hover { background-color: #f7f9fa; }
        .list-item-left { display: flex; align-items: center; gap: 12px; flex: 1; }
        .list-item img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .list-info h4 { font-size: 16px; color: #111; display: flex; align-items: center; gap: 8px; }
        .list-info p { font-size: 13px; color: #666; margin-top: 3px; }
        .unread-badge { background: var(--light-green); color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; font-weight: bold; }
        
        /* Action Buttons on List */
        .list-actions { display: flex; align-items: center; gap: 8px; }
        .toggle-call-btn { background: #ff4d4d; color: white; border: none; padding: 6px 8px; border-radius: 5px; font-size: 11px; cursor: pointer; }
        .toggle-call-btn.disabled { background: #888; }
        .delete-chat-icon { background: #ffe6e6; border: 1px solid #ff4d4d; color: #b30000; padding: 5px; border-radius: 5px; font-size: 14px; cursor: pointer; }

        /* Status Section UI */
        .status-upload-section { padding: 12px 15px; background: #ecfaf1; border-bottom: 1px solid #ddd; display: flex; flex-direction: column; gap: 8px; }
        .status-input-row { display: flex; gap: 8px; align-items: center; }
        .status-input-row input[type="text"] { flex: 1; padding: 8px 12px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        .status-media-label { font-size: 12px; color: var(--primary-green); background: white; padding: 6px 10px; border: 1px solid var(--light-green); border-radius: 15px; cursor: pointer; text-align: center; font-weight: bold; }
        .section-heading { font-size: 12px; font-weight: bold; color: #777; background: #f1f1f1; padding: 6px 15px; text-transform: uppercase; }

        /* Chat Room Screen */
        .chat-room-header { background: #eee; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #ccc; }
        .chat-header-user-info { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .chat-header-user-info img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
        .header-text-box h4 { font-size: 15px; color: var(--primary-green); }
        .header-text-box p { font-size: 11px; color: #666; }
        
        .header-actions { display: flex; align-items: center; gap: 5px; }
        .call-action-btn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 3px; }
        .theme-action-btn { background: #fff; border: 1px solid var(--primary-green); color: var(--primary-green); padding: 4px 6px; border-radius: 5px; font-size: 10px; cursor: pointer; font-weight: bold; }
        .clear-chat-btn { background: #b30000; color: white; border: none; padding: 5px 7px; border-radius: 5px; font-size: 10px; cursor: pointer; font-weight: bold; }
        
        .messages-area { flex: 1; padding: 15px; overflow-y: auto; background: #efeae2; display: flex; flex-direction: column; gap: 10px; background-size: cover; background-position: center; background-repeat: no-repeat; }
        
        /* Message Bubbles */
        .message-row { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 5px; }
        .message-row.sent { flex-direction: row-reverse; }
        .msg-dp { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        
        .message { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-break: break-word; position: relative; }
        .message.received { background: white; border: 1px solid #ddd; border-bottom-left-radius: 2px; }
        .message.sent { background: #dcf8c6; color: #111; border-bottom-right-radius: 2px; }
        .message img, .message video, .message audio { max-width: 100%; border-radius: 8px; margin-top: 5px; display: block; background: #000; }
        .message audio { width: 220px; height: 40px; }

        .msg-footer { display: flex; justify-content: flex-end; align-items: center; gap: 4px; font-size: 10px; color: #888; margin-top: 4px; }
        .message.sent .msg-footer { color: #555; }
        .ticks { font-size: 12px; font-weight: bold; }
        .ticks.blue { color: #34b7f1; }

        .chat-input-area { padding: 10px 15px; background: white; display: flex; gap: 8px; border-top: 1px solid #ddd; align-items: center; }
        .chat-input-area input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; }
        .media-btn { background: #eee; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #555; }
        .media-btn.recording { background: #ff3b30; color: white; animation: pulse 1.2s infinite; }
        .send-btn { background: var(--light-green); color: white; border: none; padding: 10px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Call Modal */
        .call-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 1000; gap: 20px; }
        .call-modal h3 { font-size: 22px; }
        .call-modal p { font-size: 14px; color: #ccc; text-align: center; padding: 0 20px; }
        .end-call-btn { background: #ff3b30; color: white; border: none; padding: 12px 25px; border-radius: 30px; font-size: 16px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body onload="initApp()" onunload="setOfflineStatus()">

    <div class="app-container">
        
        <!-- Header -->
        <div class="app-header">
            <div class="header-profile">
                <img id="headerDp" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="DP">
                <div>
                    <h2 id="headerTitle">My Business Chat</h2>
                    <p id="headerSubtitle">Welcome</p>
                </div>
            </div>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>

        <!-- Login Screen -->
        <div id="loginScreen" class="screen">
            <div class="login-box">
                <h2>Login</h2>
                <input type="text" id="userName" class="input-field" placeholder="Enter your name">
                <input type="text" id="userPhone" class="input-field" placeholder="Phone number (e.g. 03001234567)">
                <input type="password" id="userPass" class="input-field" placeholder="Password (Admin only)">
                
                <label class="file-label" for="userDpInput">📷 Select your Profile Picture (DP)</label>
                <input type="file" id="userDpInput" accept="image/*" style="display: none;" onchange="previewDp(event)">
                
                <button class="btn" onclick="handleLogin()">Get Started</button>
            </div>
        </div>

        <!-- Main Screen -->
        <div id="mainScreen" class="screen hidden">
            <div class="admin-tabs">
                <button class="tab-btn active" id="chatsTabBtn" onclick="switchTab('chats')">💬 Chats</button>
                <button class="tab-btn" id="statusTabBtn" onclick="switchTab('status')">⭕ Status</button>
                <button class="tab-btn" id="callsTabBtn" onclick="switchTab('calls')">📞 Calls</button>
            </div>
            
            <!-- Chats Container -->
            <div id="chatsContainer" class="list-container"></div>
            
            <!-- Status Screen Container -->
            <div id="statusContainer" class="list-container hidden">
                <div class="status-upload-section">
                    <div class="status-input-row">
                        <input type="text" id="statusTextInput" placeholder="Type a status text...">
                        <button class="btn" style="padding: 8px 14px; font-size: 13px;" onclick="uploadStatus('text')">Post</button>
                    </div>
                    <label class="status-media-label" for="statusMediaInput">📷 Upload Photo Status</label>
                    <input type="file" id="statusMediaInput" accept="image/*" style="display: none;" onchange="uploadStatus('image', event)">
                </div>
                
                <div id="statusListArea"></div>
            </div>

            <!-- Calls Container -->
            <div id="callsContainer" class="list-container hidden"></div>
        </div>

        <!-- Chat Room Screen -->
        <div id="chatRoomScreen" class="screen hidden">
            <div class="chat-room-header">
                <div class="chat-header-user-info" onclick="backToMain()">
                    <span id="backText" style="font-weight: bold; color: var(--primary-green);">←</span>
                    <img id="roomPeerDp" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="Peer DP">
                    <div class="header-text-box">
                        <h4 id="chatTitle">Chat</h4>
                        <p id="chatPeerStatus">Checking status...</p>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="call-action-btn" id="voiceCallBtn" onclick="startCall('audio')" title="Voice Call">📞</button>
                    <button class="call-action-btn" id="videoCallBtn" onclick="startCall('video')" title="Video Call">📹</button>
                    <button class="theme-action-btn" onclick="document.getElementById('themeInput').click()" title="Change Wallpaper">🎨 Theme</button>
                    <input type="file" id="themeInput" accept="image/*" style="display: none;" onchange="changeChatTheme(event)">
                    <button class="clear-chat-btn" onclick="clearChat()">Delete</button>
                </div>
            </div>
            
            <div class="messages-area" id="messagesArea"></div>

            <div class="chat-input-area">
                <button class="media-btn" onclick="document.getElementById('mediaInput').click()" title="Send Image or Video">📎</button>
                <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;" onchange="handleMediaSelection(event)">
                
                <button class="media-btn" id="voiceRecordBtn" onclick="toggleVoiceRecording()" title="Record Voice Note">🎤</button>

                <input type="text" id="messageInput" placeholder="Type a message here..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button class="send-btn" onclick="sendMessage()">Send</button>
            </div>
        </div>

    </div>

    <!-- Call Simulation Modal -->
    <div id="callModal" class="call-modal hidden">
        <h3 id="callTypeTitle">Audio Call in Progress...</h3>
        <p id="callTargetName">Connecting...</p>
        <button class="end-call-btn" onclick="endCall()">End Call</button>
    </div>

    <script>
        let db = null;
        let currentChatRoom = '';
        let currentUser = null;
        const DEFAULT_DP = 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100';
        let selectedDpBase64 = DEFAULT_DP;
        
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let heartbeatInterval = null;

        function getAdminDp() {
            return localStorage.getItem('admin_dp') || DEFAULT_DP;
        }

        function initApp() {
            try {
                const request = indexedDB.open("BusinessChatDB", 1);
                request.onerror = function() { checkAutoLogin(); };
                request.onsuccess = function(event) {
                    db = event.target.result;
                    checkAutoLogin();
                };
                request.onupgradeneeded = function(event) {
                    let database = event.target.result;
                    if (!database.objectStoreNames.contains("mediaStore")) {
                        database.createObjectStore("mediaStore", { keyPath: "id" });
                    }
                };
            } catch (e) {
                checkAutoLogin();
            }
            window.addEventListener('beforeunload', setOfflineStatus);
        }

        function setOfflineStatus() {
            if (currentUser) {
                let statusKey = currentUser.isAdmin ? 'status_Preeti' : 'status_' + currentUser.phone;
                localStorage.setItem(statusKey, JSON.stringify({ isOnline: false, lastSeen: Date.now() }));
            }
        }

        function updateMyOnlineStatus() {
            if (!currentUser) return;
            let statusKey = currentUser.isAdmin ? 'status_Preeti' : 'status_' + currentUser.phone;
            localStorage.setItem(statusKey, JSON.stringify({ isOnline: true, lastSeen: Date.now() }));
        }

        function previewDp(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedDpBase64 = e.target.result;
                    document.querySelector('.file-label').innerText = '✓ Profile Picture Selected';
                };
                reader.readAsDataURL(file);
            }
        }

        function checkAutoLogin() {
            const savedUser = localStorage.getItem('chat_active_user');
            if (savedUser) {
                try {
                    currentUser = JSON.parse(savedUser);
                    updateMyOnlineStatus();
                    startHeartbeat();
                    setupAppUI();
                } catch (e) {
                    localStorage.removeItem('chat_active_user');
                }
            }
        }

        function startHeartbeat() {
            if (heartbeatInterval) clearInterval(heartbeatInterval);
            heartbeatInterval = setInterval(() => {
                updateMyOnlineStatus();
                if (document.getElementById('chatRoomScreen') && !document.getElementById('chatRoomScreen').classList.contains('hidden')) {
                    updatePeerStatusDisplay();
                }
            }, 3000);
        }

        function handleLogin() {
            const nameInput = document.getElementById('userName');
            const phoneInput = document.getElementById('userPhone');
            const passInput = document.getElementById('userPass');

            if (!nameInput || !phoneInput) return;

            const name = nameInput.value.trim();
            const phone = phoneInput.value.trim();
            const pass = passInput ? passInput.value.trim() : '';

            if (!name || !phone) {
                alert('Please enter your name and phone number!');
                return;
            }

            let isAdmin = (name.toLowerCase() === 'preeti' && pass === 'preeti123');
            let allUsers = JSON.parse(localStorage.getItem('chat_all_users') || '[]');
            let existingUser = allUsers.find(u => u.phone === phone);
            
            let userDp = selectedDpBase64;

            if (isAdmin) {
                if (selectedDpBase64 !== DEFAULT_DP) {
                    localStorage.setItem('admin_dp', selectedDpBase64);
                } else {
                    userDp = getAdminDp();
                }
            } else {
                if (existingUser && existingUser.dp && selectedDpBase64 === DEFAULT_DP) {
                    userDp = existingUser.dp;
                }
            }

            currentUser = {
                name: name,
                phone: phone,
                isAdmin: isAdmin,
                dp: userDp
            };

            localStorage.setItem('chat_active_user', JSON.stringify(currentUser));
            updateMyOnlineStatus();
            startHeartbeat();

            if (!isAdmin) {
                if (!existingUser) {
                    allUsers.push(currentUser);
                } else {
                    allUsers = allUsers.map(u => u.phone === phone ? currentUser : u);
                }
                localStorage.setItem('chat_all_users', JSON.stringify(allUsers));
            }

            setupAppUI();
        }

        function setupAppUI() {
            const loginScreen = document.getElementById('loginScreen');
            const headerDp = document.getElementById('headerDp');
            
            if (loginScreen) loginScreen.classList.add('hidden');
            if (headerDp && currentUser) {
                if(currentUser.isAdmin) currentUser.dp = getAdminDp();
                headerDp.src = currentUser.dp;
            }
            
            if (currentUser) {
                document.getElementById('headerSubtitle').innerText = currentUser.isAdmin ? 'Preeti (Admin Panel)' : currentUser.name;
                document.getElementById('mainScreen').classList.remove('hidden');
                loadAdminChatList();
                loadAdminCallsList();
                loadStatuses();
            }
        }

        function switchTab(tab) {
            const chatsTab = document.getElementById('chatsTabBtn');
            const statusTab = document.getElementById('statusTabBtn');
            const callsTab = document.getElementById('callsTabBtn');
            
            const chatsContainer = document.getElementById('chatsContainer');
            const statusContainer = document.getElementById('statusContainer');
            const callsContainer = document.getElementById('callsContainer');

            chatsTab.classList.remove('active');
            statusTab.classList.remove('active');
            callsTab.classList.remove('active');
            
            chatsContainer.classList.add('hidden');
            statusContainer.classList.add('hidden');
            callsContainer.classList.add('hidden');

            if (tab === 'chats') {
                chatsTab.classList.add('active');
                chatsContainer.classList.remove('hidden');
                loadAdminChatList();
            } else if (tab === 'status') {
                statusTab.classList.add('active');
                statusContainer.classList.remove('hidden');
                loadStatuses();
            } else if (tab === 'calls') {
                callsTab.classList.add('active');
                callsContainer.classList.remove('hidden');
                loadAdminCallsList();
            }
        }

        /* --- Status System (24-Hour Expiry & Mutual Visibility) --- */
        function uploadStatus(type, event) {
            let statusText = '';

            if (type === 'text') {
                const input = document.getElementById('statusTextInput');
                statusText = input.value.trim();
                if (!statusText) {
                    alert('Please type something for your status!');
                    return;
                }
                input.value = '';
                saveStatusData(statusText, '');
            } else if (type === 'image') {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    saveStatusData('Photo Status', e.target.result);
                };
                reader.readAsDataURL(file);
                event.target.value = '';
            }
        }

        function saveStatusData(text, imgData) {
            let allStatuses = JSON.parse(localStorage.getItem('app_all_statuses') || '[]');
            allStatuses = allStatuses.filter(s => s.phone !== currentUser.phone);

            allStatuses.push({
                name: currentUser.name,
                phone: currentUser.phone,
                dp: currentUser.dp,
                text: text,
                image: imgData,
                timestamp: Date.now(),
                views: []
            });

            localStorage.setItem('app_all_statuses', JSON.stringify(allStatuses));
            loadStatuses();
            alert('Status posted successfully!');
        }

        function viewStatusItem(phone) {
            let allStatuses = JSON.parse(localStorage.getItem('app_all_statuses') || '[]');
            let statusObj = allStatuses.find(s => s.phone === phone);
            if (!statusObj) return;

            if (statusObj.phone !== currentUser.phone) {
                if (!statusObj.views) statusObj.views = [];
                if (!statusObj.views.includes(currentUser.name)) {
                    statusObj.views.push(currentUser.name);
                    localStorage.setItem('app_all_statuses', JSON.stringify(allStatuses));
                }
            }

            let viewCountText = (statusObj.phone === currentUser.phone) ? `Viewed by: ${statusObj.views ? statusObj.views.length : 0} people` : '';
            alert(`--- Status Details ---\nBy: ${statusObj.name}\nText: ${statusObj.text}\n${viewCountText}`);
            loadStatuses();
        }

        function loadStatuses() {
            const area = document.getElementById('statusListArea');
            area.innerHTML = '';

            let allStatuses = JSON.parse(localStorage.getItem('app_all_statuses') || '[]');
            let now = Date.now();
            let validStatuses = allStatuses.filter(s => (now - s.timestamp) < 86400000);
            localStorage.setItem('app_all_statuses', JSON.stringify(validStatuses));

            let myStatus = validStatuses.find(s => s.phone === currentUser.phone);
            
            const myHeading = document.createElement('div');
            myHeading.className = 'section-heading';
            myHeading.innerText = 'My Status';
            area.appendChild(myHeading);

            const myItem = document.createElement('div');
            myItem.className = 'list-item';
            if (myStatus) {
                let timeStr = new Date(myStatus.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                let viewsCount = myStatus.views ? myStatus.views.length : 0;
                myItem.onclick = () => viewStatusItem(currentUser.phone);
                myItem.innerHTML = `
                    <div class="list-item-left">
                        <img src="${myStatus.dp}" alt="DP">
                        <div class="list-info">
                            <h4>My Status (Tap to view)</h4>
                            <p>${myStatus.text}</p>
                            <span style="font-size: 11px; color: #075e54; font-weight: bold;">👁 Viewed by ${viewsCount} people | Posted at ${timeStr}</span>
                        </div>
                    </div>
                `;
            } else {
                myItem.innerHTML = `
                    <div class="list-item-left">
                        <img src="${currentUser.dp}" alt="DP">
                        <div class="list-info">
                            <h4>My Status</h4>
                            <p style="color: #888;">Tap above to add status update</p>
                        </div>
                    </div>
                `;
            }
            area.appendChild(myItem);

            const othersHeading = document.createElement('div');
            othersHeading.className = 'section-heading';
            othersHeading.innerText = 'Recent Updates (All Users & Admin)';
            area.appendChild(othersHeading);

            let otherStatuses = validStatuses.filter(s => s.phone !== currentUser.phone);
            if (otherStatuses.length === 0) {
                const emptyDiv = document.createElement('div');
                emptyDiv.style.padding = '15px';
                emptyDiv.style.textAlign = 'center';
                emptyDiv.style.color = '#666';
                emptyDiv.style.fontSize = '13px';
                emptyDiv.innerText = 'No recent updates from others.';
                area.appendChild(emptyDiv);
                return;
            }

            otherStatuses.slice().reverse().forEach(s => {
                let timeStr = new Date(s.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const item = document.createElement('div');
                item.className = 'list-item';
                item.onclick = () => viewStatusItem(s.phone);
                
                let mediaIndicator = s.image ? ' 📷 [Photo]' : '';

                item.innerHTML = `
                    <div class="list-item-left">
                        <img src="${s.dp}" alt="DP">
                        <div class="list-info">
                            <h4>${s.name}</h4>
                            <p>${s.text} ${mediaIndicator}</p>
                            <span style="font-size: 10px; color: #888;">Posted at ${timeStr}</span>
                        </div>
                    </div>
                `;
                area.appendChild(item);
            });
        }

        /* --- Flexible Chat Theme / Wallpaper Feature --- */
        function changeChatTheme(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                let base64Img = e.target.result;
                let themeKey = 'theme_' + currentUser.phone + '_' + currentChatRoom;
                localStorage.setItem(themeKey, base64Img);
                applyChatTheme();
                alert('Chat wallpaper updated successfully!');
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function applyChatTheme() {
            let themeKey = 'theme_' + currentUser.phone + '_' + currentChatRoom;
            let savedTheme = localStorage.getItem(themeKey);
            const messagesArea = document.getElementById('messagesArea');
            if (savedTheme) {
                messagesArea.style.backgroundImage = `url('${savedTheme}')`;
            } else {
                messagesArea.style.backgroundImage = 'none';
            }
        }

        function loadAdminChatList() {
            const container = document.getElementById('chatsContainer');
            container.innerHTML = '';
            
            let allUsers = JSON.parse(localStorage.getItem('chat_all_users') || '[]');
            let hiddenChats = JSON.parse(localStorage.getItem('hidden_chats_admin') || '[]');
            
            if (!currentUser.isAdmin) {
                const item = document.createElement('div');
                item.className = 'list-item';
                item.innerHTML = `
                    <div class="list-item-left" onclick="openChat('Preeti_Admin_' + currentUser.phone, 'Preeti (Admin)', 'Preeti')">
                        <img src="${getAdminDp()}" alt="DP">
                        <div class="list-info">
                            <h4>Preeti (Admin)</h4>
                            <p>Tap here to chat with Admin</p>
                        </div>
                    </div>
                `;
                container.appendChild(item);
                return;
            }

            let visibleUsers = allUsers.filter(u => !hiddenChats.includes(u.phone));
            
            if (visibleUsers.length === 0) {
                container.innerHTML = '<div style="padding: 20px; text-align: center; color: #666;">No active chats found.</div>';
                return;
            }

            visibleUsers.forEach(u => {
                const roomKey = 'Preeti_Admin_' + u.phone;
                let callDisabled = localStorage.getItem('call_disabled_' + u.phone) === 'true';

                let allMsgs = JSON.parse(localStorage.getItem('msgs_' + roomKey) || '[]');
                let lastReadTime = parseInt(localStorage.getItem('admin_read_' + roomKey) || '0');
                let hasUnread = allMsgs.some(m => m.senderName !== 'Preeti' && m.timestamp > lastReadTime);

                let uStatus = JSON.parse(localStorage.getItem('status_' + u.phone) || '{"isOnline":false, "lastSeen":0}');
                let isOnlineNow = uStatus.isOnline && (Date.now() - uStatus.lastSeen < 6000);
                let statusText = isOnlineNow ? '<span style="color: green;">● Online</span>' : 'Offline';

                const item = document.createElement('div');
                item.className = 'list-item';
                item.innerHTML = `
                    <div class="list-item-left" onclick="openChat('${roomKey}', '${u.name} (${u.phone})', '${u.phone}')">
                        <img src="${u.dp}" alt="DP">
                        <div class="list-info">
                            <h4>${u.name} ${hasUnread ? '<span class="unread-badge">New</span>' : ''}</h4>
                            <p>Phone: ${u.phone} | ${statusText}</p>
                        </div>
                    </div>
                    <div class="list-actions">
                        <button class="toggle-call-btn ${callDisabled ? 'disabled' : ''}" onclick="toggleUserCalls('${u.phone}', event)" title="Toggle Call Permission">
                            ${callDisabled ? 'Calls Off' : 'Calls On'}
                        </button>
                        <button class="delete-chat-icon" onclick="deleteChatCompletely('${u.phone}', event)" title="Delete Chat">🗑️</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function loadAdminCallsList() {
            const container = document.getElementById('callsContainer');
            container.innerHTML = '';
            let callHistory = JSON.parse(localStorage.getItem('admin_call_logs') || '[]');
            
            if (callHistory.length === 0) {
                container.innerHTML = '<div style="padding: 20px; text-align: center; color: #666;">No call logs found.</div>';
                return;
            }

            callHistory.slice().reverse().forEach(call => {
                const roomKey = 'Preeti_Admin_' + call.phone;
                const timeStr = new Date(call.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                const item = document.createElement('div');
                item.className = 'list-item';
                item.onclick = () => openChat(roomKey, call.name + ' (' + call.phone + ')', call.phone);
                item.innerHTML = `
                    <div class="list-item-left">
                        <img src="${call.dp}" alt="DP">
                        <div class="list-info">
                            <h4>${call.name} (${call.type === 'video' ? '📹 Video Call' : '📞 Voice Call'})</h4>
                            <p>Time: ${timeStr} | Phone: ${call.phone}</p>
                        </div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function toggleUserCalls(phone, event) {
            event.stopPropagation();
            let key = 'call_disabled_' + phone;
            let currentStatus = localStorage.getItem(key) === 'true';
            localStorage.setItem(key, !currentStatus);
            loadAdminChatList();
        }

        function deleteChatCompletely(phone, event) {
            if (event) event.stopPropagation();
            if (confirm('Are you sure you want to delete this chat completely?')) {
                let roomKey = 'Preeti_Admin_' + phone;
                localStorage.removeItem('msgs_' + roomKey);
                
                let hiddenChats = JSON.parse(localStorage.getItem('hidden_chats_admin') || '[]');
                if (!hiddenChats.includes(phone)) {
                    hiddenChats.push(phone);
                    localStorage.setItem('hidden_chats_admin', JSON.stringify(hiddenChats));
                }
                
                if(!document.getElementById('chatRoomScreen').classList.contains('hidden')) {
                    backToMain();
                } else {
                    loadAdminChatList();
                }
            }
        }

        function clearChat() {
            let phoneToCheck = currentUser.isAdmin ? currentChatRoom.replace('Preeti_Admin_', '') : currentUser.phone;
            
            if (currentUser.isAdmin) {
                deleteChatCompletely(phoneToCheck, null);
            } else {
                if (confirm('Are you sure you want to clear your chat history?')) {
                    let clearedKey = 'cleared_' + phoneToCheck + '_' + currentChatRoom;
                    localStorage.setItem(clearedKey, Date.now());
                    loadMessages();
                }
            }
        }

        function openChat(roomKey, title, phone) {
            currentChatRoom = roomKey;
            
            let callDisabled = localStorage.getItem('call_disabled_' + phone) === 'true';
            
            if (callDisabled) {
                document.getElementById('voiceCallBtn').style.display = 'none';
                document.getElementById('videoCallBtn').style.display = 'none';
            } else {
                document.getElementById('voiceCallBtn').style.display = 'inline-block';
                document.getElementById('videoCallBtn').style.display = 'inline-block';
            }

            document.getElementById('mainScreen').classList.add('hidden');
            if (currentUser.isAdmin) {
                localStorage.setItem('admin_read_' + roomKey, Date.now());
            }

            markMessagesAsRead();

            document.getElementById('chatRoomScreen').classList.remove('hidden');
            document.getElementById('chatTitle').innerText = title.split(' (')[0];
            
            let peerDp = getAdminDp();
            if (currentUser.isAdmin) {
                let allUsers = JSON.parse(localStorage.getItem('chat_all_users') || '[]');
                let u = allUsers.find(x => x.phone === phone);
                if (u) peerDp = u.dp;
            }
            document.getElementById('roomPeerDp').src = peerDp;

            applyChatTheme();
            updatePeerStatusDisplay();
            loadMessages();
        }

        function updatePeerStatusDisplay() {
            if (!currentChatRoom) return;
            let phone = currentUser.isAdmin ? currentChatRoom.replace('Preeti_Admin_', '') : 'Preeti';
            let statusKey = currentUser.isAdmin ? 'status_' + phone : 'status_Preeti';

            let statusData = JSON.parse(localStorage.getItem(statusKey) || '{"isOnline":false, "lastSeen":0}');
            let isOnline = statusData.isOnline && (Date.now() - statusData.lastSeen < 6000);

            let statusEl = document.getElementById('chatPeerStatus');
            if (isOnline) {
                statusEl.innerHTML = '<span style="color: #25d366; font-weight: bold;">Online</span>';
            } else {
                if (statusData.lastSeen === 0) {
                    statusEl.innerText = 'Offline';
                } else {
                    let lastSeenDate = new Date(statusData.lastSeen);
                    let timeStr = lastSeenDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    statusEl.innerText = 'Last seen at ' + timeStr;
                }
            }
        }

        function markMessagesAsRead() {
            let allMessages = JSON.parse(localStorage.getItem('msgs_' + currentChatRoom) || '[]');
            let updated = false;
            
            allMessages.forEach(m => {
                if (currentUser.isAdmin && m.senderName !== 'Preeti' && !m.isRead) {
                    m.isRead = true;
                    updated = true;
                } else if (!currentUser.isAdmin && m.senderName === 'Preeti' && !m.isRead) {
                    m.isRead = true;
                    updated = true;
                }
            });

            if (updated) {
                localStorage.setItem('msgs_' + currentChatRoom, JSON.stringify(allMessages));
            }
        }

        function backToMain() {
            document.getElementById('chatRoomScreen').classList.add('hidden');
            document.getElementById('mainScreen').classList.remove('hidden');
            loadAdminChatList();
            loadAdminCallsList();
            loadStatuses();
        }

        function startCall(type) {
            const modal = document.getElementById('callModal');
            const titleEl = document.getElementById('callTypeTitle');
            const targetEl = document.getElementById('callTargetName');

            if (type === 'audio') {
                titleEl.innerText = 'Audio Call...';
            } else {
                titleEl.innerText = 'Video Call...';
            }

            let phone = currentUser.isAdmin ? currentChatRoom.replace('Preeti_Admin_', '') : 'Preeti';
            let statusKey = currentUser.isAdmin ? 'status_' + phone : 'status_Preeti';
            let statusData = JSON.parse(localStorage.getItem(statusKey) || '{"isOnline":false, "lastSeen":0}');
            let isOnline = statusData.isOnline && (Date.now() - statusData.lastSeen < 6000);

            if (isOnline) {
                targetEl.innerHTML = 'Ringing...<br><span style="font-size:12px; color:#25d366;">Connected / Calling target...</span>';
            } else {
                targetEl.innerHTML = '<span style="color: #ff4d4d; font-weight: bold;">Offline Notice:</span><br>The person you are calling is currently offline!';
            }

            modal.classList.remove('hidden');

            let callerName = currentUser.name;
            let callerPhone = currentUser.isAdmin ? currentChatRoom.replace('Preeti_Admin_', '') : currentUser.phone;
            let callerDp = currentUser.dp;

            let callLogs = JSON.parse(localStorage.getItem('admin_call_logs') || '[]');
            callLogs.push({
                name: callerName,
                phone: callerPhone,
                dp: callerDp,
                type: type,
                timestamp: Date.now()
            });
            localStorage.setItem('admin_call_logs', JSON.stringify(callLogs));
        }

        function endCall() {
            document.getElementById('callModal').classList.add('hidden');
        }

        function getDpForUser(senderName) {
            if (senderName === 'Preeti') {
                return getAdminDp();
            }
            let allUsers = JSON.parse(localStorage.getItem('chat_all_users') || '[]');
            let found = allUsers.find(u => u.name === senderName);
            if (found && found.dp) return found.dp;
            if (currentUser && currentUser.name === senderName) return currentUser.dp;
            return DEFAULT_DP;
        }

        function loadMessages() {
            const area = document.getElementById('messagesArea');
            area.innerHTML = '';
            
            let phoneToCheck = currentUser.isAdmin ? currentChatRoom.replace('Preeti_Admin_', '') : currentUser.phone;
            let clearedKey = 'cleared_' + phoneToCheck + '_' + currentChatRoom;
            let clearTime = localStorage.getItem(clearedKey) || 0;

            let allMessages = JSON.parse(localStorage.getItem('msgs_' + currentChatRoom) || '[]');
            
            let visibleMessages = allMessages.filter(m => {
                if (currentUser.isAdmin) return true;
                return m.timestamp > clearTime;
            });

            if (visibleMessages.length === 0) {
                area.innerHTML = '<div class="message received" style="margin: auto;">Chat is empty. Send a message!</div>';
                return;
            }

            visibleMessages.forEach(m => {
                let isSent = (m.senderName === currentUser.name);
                let senderDp = getDpForUser(m.senderName);
                
                const row = document.createElement('div');
                row.className = 'message-row ' + (isSent ? 'sent' : 'received');

                const dpImg = document.createElement('img');
                dpImg.className = 'msg-dp';
                dpImg.src = senderDp;
                row.appendChild(dpImg);

                const msgBox = document.createElement('div');
                msgBox.className = 'message ' + (isSent ? 'sent' : 'received');

                let timeStr = new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                let ticksHtml = '';
                if (isSent) {
                    let tickColorClass = m.isRead ? 'ticks blue' : 'ticks';
                    ticksHtml = `<span class="${tickColorClass}">✓✓</span>`;
                }

                let innerHtmlContent = '';
                if (m.type === 'text') {
                    innerHtmlContent = `<span>${m.text}</span>`;
                } else {
                    innerHtmlContent = `<span>Loading media...</span>`;
                }

                msgBox.innerHTML = `
                    ${innerHtmlContent}
                    <div class="msg-footer">
                        <span>${timeStr}</span>
                        ${ticksHtml}
                    </div>
                `;
                row.appendChild(msgBox);
                area.appendChild(row);

                if (m.type !== 'text') {
                    loadMediaContent(m, msgBox);
                }
            });
            area.scrollTop = area.scrollHeight;
        }

        function loadMediaContent(m, msgBox) {
            if (db) {
                try {
                    let transaction = db.transaction(["mediaStore"], "readonly");
                    let store = transaction.objectStore("mediaStore");
                    let request = store.get(m.fileId);
                    request.onsuccess = function(event) {
                        let result = event.target.result;
                        if (result) {
                            renderMediaElement(m.type, result.data, msgBox);
                        } else {
                            renderMediaElement(m.type, m.fallbackData, msgBox);
                        }
                    };
                    request.onerror = function() { renderMediaElement(m.type, m.fallbackData, msgBox); };
                } catch (e) {
                    renderMediaElement(m.type, m.fallbackData, msgBox);
                }
            } else {
                renderMediaElement(m.type, m.fallbackData, msgBox);
            }
        }

        function renderMediaElement(type, data, msgBox) {
            if (!data) {
                msgBox.querySelector('span').innerText = '[Media file missing]';
                return;
            }
            let timeStr = msgBox.querySelector('.msg-footer').innerHTML;
            if (type === 'image') {
                msgBox.innerHTML = `<img src="${data}" alt="Image"><div class="msg-footer">${timeStr}</div>`;
            } else if (type === 'video') {
                msgBox.innerHTML = `<video controls src="${data}"></video><div class="msg-footer">${timeStr}</div>`;
            } else if (type === 'audio') {
                msgBox.innerHTML = `<audio controls src="${data}"></audio><div class="msg-footer">${timeStr}</div>`;
            }
        }

        function saveMessageToStorage(msgObj) {
            let allMessages = JSON.parse(localStorage.getItem('msgs_' + currentChatRoom) || '[]');
            allMessages.push(msgObj);
            localStorage.setItem('msgs_' + currentChatRoom, JSON.stringify(allMessages));
            
            if (!currentUser.isAdmin) {
                let hiddenChats = JSON.parse(localStorage.getItem('hidden_chats_admin') || '[]');
                if (hiddenChats.includes(currentUser.phone)) {
                    hiddenChats = hiddenChats.filter(p => p !== currentUser.phone);
                    localStorage.setItem('hidden_chats_admin', JSON.stringify(hiddenChats));
                }
            }

            loadMessages();
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (text !== '') {
                saveMessageToStorage({
                    senderName: currentUser.name,
                    type: 'text',
                    text: text,
                    timestamp: Date.now(),
                    isRead: false
                });
                input.value = '';
            }
        }

        function handleMediaSelection(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result;
                let fileType = 'image';
                if (file.type.includes('video') || file.name.match(/\.(mp4|m4v|mov|webm|ogv)$/i)) {
                    fileType = 'video';
                }

                let fileId = 'media_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);

                if (db) {
                    try {
                        let transaction = db.transaction(["mediaStore"], "readwrite");
                        let store = transaction.objectStore("mediaStore");
                        store.put({ id: fileId, data: base64Data });

                        transaction.oncomplete = function() {
                            saveMessageToStorage({ senderName: currentUser.name, type: fileType, fileId: fileId, timestamp: Date.now(), isRead: false });
                        };
                        transaction.onerror = function() {
                            saveMessageToStorage({ senderName: currentUser.name, type: fileType, fileId: fileId, fallbackData: base64Data, timestamp: Date.now(), isRead: false });
                        };
                    } catch (e) {
                        saveMessageToStorage({ senderName: currentUser.name, type: fileType, fileId: fileId, fallbackData: base64Data, timestamp: Date.now(), isRead: false });
                    }
                } else {
                    saveMessageToStorage({ senderName: currentUser.name, type: fileType, fileId: fileId, fallbackData: base64Data, timestamp: Date.now(), isRead: false });
                }
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function toggleVoiceRecording() {
            const btn = document.getElementById('voiceRecordBtn');
            if (!isRecording) {
                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = event => { audioChunks.push(event.data); };
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = function() {
                            const base64Audio = reader.result;
                            let fileId = 'audio_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);

                            if (db) {
                                try {
                                    let transaction = db.transaction(["mediaStore"], "readwrite");
                                    let store = transaction.objectStore("mediaStore");
                                    store.put({ id: fileId, data: base64Audio });
                                    transaction.oncomplete = function() {
                                        saveMessageToStorage({ senderName: currentUser.name, type: 'audio', fileId: fileId, timestamp: Date.now(), isRead: false });
                                    };
                                    transaction.onerror = function() {
                                        saveMessageToStorage({ senderName: currentUser.name, type: 'audio', fileId: fileId, fallbackData: base64Audio, timestamp: Date.now(), isRead: false });
                                    };
                                } catch (e) {
                                    saveMessageToStorage({ senderName: currentUser.name, type: 'audio', fileId: fileId, fallbackData: base64Audio, timestamp: Date.now(), isRead: false });
                                }
                            } else {
                                saveMessageToStorage({ senderName: currentUser.name, type: 'audio', fileId: fileId, fallbackData: base64Audio, timestamp: Date.now(), isRead: false });
                            }
                        };
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    btn.classList.add('recording');
                    btn.title = "Recording... Click to stop";
                }).catch(err => {
                    alert('Microphone permission denied!');
                });
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.classList.remove('recording');
                btn.title = "Record Voice Note";
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
        }

        function handleLogout() {
            setOfflineStatus();
            localStorage.removeItem('chat_active_user');
            location.reload();
        }
    </script>
</body>
</html>
